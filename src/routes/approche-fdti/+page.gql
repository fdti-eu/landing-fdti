query getApproachPageContent($name: String!, $url: String!) {
	approach_intro {
		status
		translations(filter: { languages_code: { name: { _eq: $name } } }) {
			title
			description
			description_2
		}
	}
	approach_category(sort: ["order_value"], filter: { status: { _eq: "published" } }) {
		charge
		value
		order_value
		translations(filter: { languages_code: { name: { _eq: $name } } }) {
			title
		}
		icon {
			filename_disk
		}
		card_list(sort: ["order"], filter: { status: { _eq: "published" } }) {
			name
			order
			icon {
				id
			}
			translations(filter: { languages_code: { name: { _eq: $name } } }) {
				title
				description
			}
		}
	}
	meta_tags {
		page_tags(filter: { url: { _eq: $url } }) {
			url
			img {
				id
			}
			translations(filter: { languages_code: { name: { _eq: $name } } }) {
				title
				description
			}
		}
	}
}
